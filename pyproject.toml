[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-retention-workflow"
version = "1.0.0"
description = "Enterprise multi-agent workflow for customer churn retention."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Equipo 2 - Abandono"}]
dependencies = [
    "pydantic>=2.5,<3.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "reportlab>=4.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.33",
    "plotly>=5.20",
]
dev = [
    "streamlit>=1.33",
    "plotly>=5.20",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "isort>=5.12",
    "flake8>=7.0",
    "pylint>=3.0",
    "mypy>=1.8",
    "bandit>=1.7",
    "radon>=6.0",
    "pre-commit>=3.6",
]

[project.scripts]
retention-workflow = "customer_retention.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
customer_retention = ["resources/*.csv", "resources/*.md"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src", "tests", "scripts"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=customer_retention --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["customer_retention"]
branch = true
omit = [
    "*/infrastructure/model_trainer.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pylint.main]
py-version = "3.11"
source-roots = ["src"]
ignore = ["tests"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = ["too-few-public-methods", "duplicate-code"]

[tool.radon]
cc_min = "B"
